<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar Sesión | Alberto García</title>

<meta name="description" content="Acceso exclusivo a recetas saludables para pacientes de Alberto García.">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/svg+xml" href="logo-nutriologo.svg">

<link rel="stylesheet" href="login.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-logo">
            <div class="login-logo-icon">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <span>Alberto García</span>
        </div>

        <div class="login-badge">
            <i class="fa-solid fa-lock"></i>
            ACCESO EXCLUSIVO
        </div>

        <h1>Recetas para Pacientes</h1>

        <p class="login-subtitle">
            Inicia sesión con el correo y la contraseña
            que te compartió Alberto García.
        </p>

        <form id="loginForm">

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required autocomplete="username">

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">

            <button type="submit" id="loginBtn">
                Iniciar Sesión
            </button>

        </form>

        <p class="login-error" id="loginError"></p>

        <p class="login-help">
            ¿No tienes acceso o se te olvidó tu contraseña?
            <a href="https://wa.me/5213313229323?text=Hola,%20necesito%20ayuda%20con%20mi%20acceso%20a%20las%20recetas" target="_blank">
                Escríbele a Alberto por WhatsApp
            </a>
        </p>

        <a href="index.html" class="login-back">
            <i class="fa-solid fa-arrow-left"></i> Volver al inicio
        </a>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="login.js"></script>

</body>
</html>
